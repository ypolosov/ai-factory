# OpenSpec проекта: схема фабрики (openspec/schemas/factory) и правила артефактов.
# Изменения пишет роль spec, утверждает человек слиянием PR.
schema: factory

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Проект: todo list на TypeScript и Node 24 - сервер на node:http, страница рисуется
  на сервере, данные в памяти процесса; зависимостей для работы приложения нет.
  Фабрика: каждую задачу из tasks.md выполняет отдельный агент в отдельном PR;
  приёмочные сценарии на Gherkin (features/, метки @task-X.Y) пишет отдельная роль
  до разработки.

rules:
  proposal:
    - Добавь раздел "Критерии успеха" - наблюдаемые признаки готовности всего изменения.
    - Добавь раздел "Вне рамок" - что изменение сознательно не делает.
  specs:
    - Каждый сценарий проверяем снаружи через HTTP - запрос и ожидаемый ответ или содержимое страницы.
  design:
    - Каждое решение записывай как ADR - контекст, решение, рассмотренные альтернативы, последствия.
  tasks:
    - Одна задача - один PR одного агента, не больше 2-3 часов работы человека.
    - Номер задачи X.Y - в начале описания, зависимости - в конце, например "(после 1.1)".
    - У каждой задачи укажи сценарии требований, которые она закрывает, например "[сценарии - Добавление задачи]".
    - Не выделяй отдельные задачи на тесты - модульные тесты входят в задачу, приёмочные сценарии пишет роль tests.
    - Пути файлов - TypeScript (`src/*.ts`, `test/*.test.ts`).
