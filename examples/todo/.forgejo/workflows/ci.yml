# Проверки PR. Детерминированные ворота перед решением человека: модульные тесты, типы,
# приёмочные сценарии, секреты, уязвимые зависимости, статический анализ; без их зелёных
# статусов main не слить (защиту ставит scripts/setup-repo.sh). После них - ворота ИИ.
# Код из PR и его зависимости - недоверенные: npm ci, тесты и сценарии идут через
# factory-untrusted. Сканеры берут настройки фабрики (/etc/factory/checks) и не слушают
# файлы исключений и пометки-подавления из проверяемого кода.
name: ci
on: [pull_request]

env:
  PR_REF: pull/${{ github.event.pull_request.number }}/head

jobs:
  test:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
          chown -R node:node work
      - name: Зависимости разработки (без скриптов установки, с повторами)
        run: cd work && factory-untrusted factory-npm-ci
      - name: Модульные тесты
        # Команда задана здесь, а не сценарием package.json: PR не может её подменить.
        run: cd work && factory-untrusted node --test "test/**/*.test.ts" 2>&1 | tee ../check.log
      - name: Подробности - комментарием в PR (для доработки)
        if: failure()
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: factory-pr-comment "модульные тесты" check.log 60

  types:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
          chown -R node:node work
      - name: Зависимости разработки (без скриптов установки, с повторами)
        run: cd work && factory-untrusted factory-npm-ci
      - name: Проверка типов TypeScript
        run: cd work && factory-untrusted npx --no-install tsc --noEmit 2>&1 | tee ../check.log
      - name: Подробности - комментарием в PR (для доработки)
        if: failure()
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: factory-pr-comment "типы TypeScript" check.log 60

  acceptance:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
          chown -R node:node work
      - name: Зависимости разработки (без скриптов установки, с повторами)
        run: cd work && factory-untrusted factory-npm-ci
      - name: Приёмочные сценарии (Gherkin) - сделанных пунктов и пункта PR
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: cd work && factory-acceptance "${{ github.server_url }}" "${{ github.repository }}" "$BRANCH" 2>&1 | tee ../check.log
      - name: Подробности - комментарием в PR (для доработки)
        if: failure()
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: factory-pr-comment "приёмочные сценарии" check.log 80

  mutation:
    runs-on: ci
    steps:
      - name: Рабочая копия PR и изменённый код
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
          git -C work diff --name-only origin/main...HEAD -- 'src/*.ts' | grep -v '\.d\.ts$' > changed.txt || true
          # Пометки "Stryker disable" в изменениях PR отключили бы проверку - не допускаются.
          if git -C work diff origin/main...HEAD -- src | grep -q '^+.*Stryker disable'; then
            echo "в изменениях есть пометки Stryker disable - мутационное тестирование нельзя отключать" | tee check.log
            exit 1
          fi
          chown -R node:node work
      - name: Зависимости разработки (без скриптов установки, с повторами)
        run: cd work && factory-untrusted factory-npm-ci
      - name: Мутационное тестирование изменённого кода (StrykerJS)
        run: |
          threshold=$(yq '.gate.mutation_break // 60' work/.factory/config.yml)
          cd work && factory-mutation "$threshold" $(cat ../changed.txt) 2>&1 | tee ../check.log
      - name: Подробности - комментарием в PR (для доработки)
        if: failure()
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: factory-pr-comment "мутационное тестирование (выжившие мутанты - слабые места модульных тестов)" check.log 120

  secrets:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
      - name: Секреты в коммитах PR (Gitleaks)
        run: |
          # .gitleaksignore Gitleaks читает и из корня проверяемого репозитория, даже
          # при явном --gitleaks-ignore-path: файлы из PR убираем из рабочей копии.
          find work -name .git -prune -o -name .gitleaksignore -type f -exec rm -f {} +
          base=$(git -C work merge-base origin/main HEAD)
          gitleaks git work --no-banner --redact --log-opts="$base..HEAD" \
            --config /etc/factory/checks/gitleaks.toml --gitleaks-ignore-path /etc/factory/checks \
            --ignore-gitleaks-allow

  deps:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
      - name: Уязвимые зависимости (OSV-Scanner)
        # API OSV недоступен - проверка по скачанной базе OSV (factory-deps).
        run: factory-deps work

  sast:
    runs-on: ci
    steps:
      - name: Рабочая копия PR
        run: |
          git clone -q "${{ github.server_url }}/${{ github.repository }}.git" work
          git -C work fetch -q origin "$PR_REF" && git -C work checkout -q FETCH_HEAD
      - name: Статический анализ (Opengrep, правила фабрики)
        run: |
          cd work
          # Файлы исключений из PR не действуют; пустой корневой файл отменяет и
          # исключения по умолчанию (иначе каталоги test/ не проверяются).
          find . -name .git -prune -o \( -name .semgrepignore -o -name .opengrepignore \) -type f -exec rm -f {} +
          : > .semgrepignore
          opengrep scan --config /etc/factory/checks/opengrep.yml --disable-nosem --error --quiet .

  # Ворота ИИ: после детерминированных проверок PR агента-разработчика оценивают судьи -
  # модели по подпискам (Claude Code, Codex) из семейств, отличных от модели разработки;
  # низкая оценка или красные проверки - доработка агентом, высокая - человеку
  # (factory-gate, судьи и пороги - .factory/config.yml основной ветки).
  gate:
    needs: [test, types, acceptance, mutation, secrets, deps, sast]
    if: always()
    runs-on: ci
    steps:
      - name: Настройки фабрики - из основной ветки
        run: git clone -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" base
      - name: Оценка судьями и решение
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GATEWAY_URL: http://gateway:4000
          # Судьи - по подпискам владельца: ключ шлюза подписок и входы Claude Code и Codex.
          GATEWAY_KEY: ${{ secrets.AGENT_SUB_GATEWAY_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CONFIG: base/.factory/config.yml
          CHECKS: >-
            test=${{ needs.test.result }} types=${{ needs.types.result }}
            acceptance=${{ needs.acceptance.result }} mutation=${{ needs.mutation.result }}
            secrets=${{ needs.secrets.result }} deps=${{ needs.deps.result }} sast=${{ needs.sast.result }}
        run: factory-gate
