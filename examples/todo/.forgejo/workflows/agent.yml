# Задача с меткой -> агент нужной роли в песочнице -> PR от бота.
# Метка выбирает роль: agent - разработка, agent:spec - спецификация, agent:tests -
# приёмочные тесты. Исполнитель, модель и разрешённые пути роли - из .factory/config.yml
# основной ветки (нет файла - переменные репозитория FACTORY_EXECUTOR и FACTORY_MODEL).
# Повторная метка на задаче с открытым PR - доработка: агент продолжает в ветке прошлой
# попытки и получает замечания к ней (комментарии и ревью PR после её последнего коммита).
# Два задания: агент работает без права записи в git, а PR открывает задание
# без ключа модели. Патч передаётся между ними артефактом.
name: agent
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent' || startsWith(github.event.label.name, 'agent:')
    runs-on: agent
    timeout-minutes: 40
    steps:
      - name: Рабочая копия (только чтение) - ветка прошлой попытки или основная
        env:
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}.git"
          git clone -q --depth 1 "$url" base
          if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
            git clone -q --depth 1 -b "$BRANCH" "$url" work
            echo "FACTORY_REWORK=1" >> "$GITHUB_ENV"
          else
            cp -a base work
          fi
      - name: Роль, исполнитель и правила путей - из основной ветки
        env:
          LABEL: ${{ github.event.label.name }}
          FACTORY_EXECUTOR: ${{ vars.FACTORY_EXECUTOR }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
        run: |
          role=${LABEL#agent}
          role=${role#:}
          factory-role "${role:-dev}" base/.factory/config.yml | tee -a "$GITHUB_ENV"
      - name: Текст задачи и замечания к прошлой попытке - в файл, как недоверенный ввод
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          BRANCH: agent/issue-${{ github.event.issue.number }}
        run: |
          printf '# %s\n\n%s\n' "$TITLE" "$BODY" > task.md
          if [ -n "${FACTORY_REWORK:-}" ]; then
            factory-feedback "${{ github.server_url }}" "${{ github.repository }}" "$BRANCH" > feedback.md
            if [ -s feedback.md ]; then
              printf '\n## Замечания к прошлой попытке\n\n' >> task.md
              cat feedback.md >> task.md
            fi
            echo "доработка: замечаний $(grep -c '^### ' feedback.md || true)"
          fi
      - name: Агент
        env:
          GATEWAY_URL: http://gateway:4000
          # Ключи шлюза обоих путей: factory-agent отдаёт обвязке только ключ её исполнителя.
          GATEWAY_KEY_API: ${{ secrets.AGENT_GATEWAY_KEY }}
          GATEWAY_KEY_SUB: ${{ secrets.AGENT_SUB_GATEWAY_KEY }}
          # Метка задачи в журнале шлюза: репозиторий, задача, прогон (номера задач в разных
          # репозиториях совпадают).
          TASK_ID: ${{ github.event.repository.name }}-issue-${{ github.event.issue.number }}-run-${{ github.run_number }}
          # Входы подписок владельца: factory-agent отдаёт только вход выбранного исполнителя.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: cd work && factory-agent --task ../task.md --out ../out
      - name: Журнал агента
        if: always()
        run: tail -n 60 out/agent.log || true
      - name: Результат - артефактом (и при неудаче, для разбора)
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: agent-result
          path: out/

  publish:
    needs: implement
    runs-on: ci
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: agent-result
          path: out
      - name: Правила путей роли - из основной ветки, а не из результата агента
        env:
          LABEL: ${{ github.event.label.name }}
          FACTORY_EXECUTOR: ${{ vars.FACTORY_EXECUTOR }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
        run: |
          git clone -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" base
          role=${LABEL#agent}
          role=${role#:}
          factory-role "${role:-dev}" base/.factory/config.yml | tee -a "$GITHUB_ENV"
      - name: Проверка патча и PR от бота
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: factory-publish --result out
