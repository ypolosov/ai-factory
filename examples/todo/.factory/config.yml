# Настройки фабрики для репозитория: роли агентов, правила путей и ворота ревью.
# Файл защищён: менять его может только человек (ворота публикации и защита ветки).
# Метка задачи выбирает роль: agent - dev, agent:spec - spec, agent:tests - tests.
roles:
  # Замысел, требования, архитектура, задачи и план проверки (OpenSpec).
  spec:
    executor: claude
    model: opus
    paths:
      allowed: [openspec/]
  # Приёмочные сценарии на Gherkin и шаги к ним - до разработки.
  tests:
    executor: codex
    model: default
    paths:
      allowed: [features/]
  # Разработка одной задачи из tasks.md. Исполнители: claude, codex (подписки владельца),
  # opencode (открытые модели через OpenRouter, model - псевдоним шлюза).
  dev:
    executor: codex
    model: gpt-6.1-sol
    paths:
      protected: [.forgejo/, .github/, .factory/, openspec/, features/]
  # Судьи ворот ИИ - "исполнитель/модель" по подпискам (claude, codex); в деле только те,
  # чьё семейство отличается от семейства модели разработки.
  review:
    judges: [claude/opus, claude/sonnet]

# Семейства моделей: судья ревью не должен быть из семейства автора кода.
families:
  default: zhipu
  hard: zhipu
  alt: deepseek
  qwen: qwen
  sonnet: anthropic
  opus: anthropic
  gpt-6.1-sol: openai

# Ворота ревью: ниже rework_below - на доработку (не больше max_iterations кругов);
# от human_from и без замечаний по безопасности - человеку; остальное - тоже человеку.
gate:
  rework_below: 60
  human_from: 80
  max_spread: 15
  max_iterations: 3
  # Мутационное тестирование изменённого кода: доля убитых мутантов не ниже, %.
  mutation_break: 60
