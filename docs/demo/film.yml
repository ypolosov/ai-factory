# Сценарий съёмки видео-демо: шаги сценария демо (scenario.md) - кто действует, как и что показать.
# Действуют участники через API под своими учётками; камера только снимает экраны.
# Решения в точках решения человек принимает вживую: шаг с do.decision называет команду и ждёт итога.
# Запуск: scripts/demo-film.sh [--only шаг,шаг]
title: Повторный розыгрыш невостребованного приза

# Участники: человек действует учёткой фабрики, ИИ-персонажи - своими учётками бота Discord и
# Atlassian (.state/discord-<id>.env, .state/atlassian-<id>.env; jira - accountId для назначения).
personas:
  owner: { name: Юрий - владелец продукта, kind: human, browser: atlassian }
  po: { name: PO, kind: ai, discord: po, atlassian: po, jira: "712020:d3f88f83-dcbc-47dd-a6ce-032bd266ee21", browser: atlassian }
  pm: { name: PM, kind: ai, discord: pm, atlassian: pm, jira: "712020:63480dfc-cc04-4e6b-8f57-f1c9929f0c89", browser: atlassian }
  architect: { name: Архитектор, kind: ai, discord: architect, atlassian: architect, jira: "712020:60a01f69-2ed8-4e0b-a353-b5cdebb46f2e", browser: atlassian }
  designer: { name: Дизайнер, kind: ai, discord: designer, atlassian: designer, jira: "712020:28c9e50f-44b7-4de5-8f75-5b4e5b245871", browser: atlassian }
  frontend: { name: Фронтенд, kind: ai, discord: frontend, atlassian: frontend, jira: "712020:47ae87fe-7e13-4728-8ea0-f21c42af68bb", browser: atlassian }
  backend: { name: Бэкенд, kind: ai, discord: backend, atlassian: backend, jira: "712020:41e37ff7-488f-49d0-84fc-78be0d419a58", browser: atlassian }
  qa: { name: QA, kind: ai, discord: qa, atlassian: qa, jira: "712020:4246dca1-3b5d-4ded-8888-7c30d2cadc6c", browser: atlassian }
  devops: { name: DevOps, kind: ai, discord: devops, atlassian: devops, jira: "712020:3f787141-f967-45cc-bf8b-9eb71e7c01b4", browser: atlassian }

# Сохранённые входы камеры в каталоге состояния (.state).
browsers:
  atlassian: camera/jira.json

steps:
  - id: librarian
    chapter: База знаний отвечает команде
    note: PM спрашивает фабрику в Discord, ответ - со ссылками на правила и решения проекта
    who: pm
    do:
      discord: { channel: продукт, text: "@factory что известно про невостребованные призы?" }
    wait:
      timeout: 180
      discord: { channel: продукт, contains: "Источники" }

  - id: story
    chapter: Требование сверяется со знаниями проекта
    note: Владелец продукта пишет стори в Confluence, фабрика заводит её в Jira и сверяет
    who: owner
    do:
      wiki:
        title: "Проба съёмки: сколько дней осталось подтвердить приз"
        body: "Победитель видит, сколько дней у него осталось, чтобы подтвердить приз. Когда срок истёк, приз становится невостребованным."
        label: story
    wait:
      timeout: 300
      jira: { label: "wiki-{story.page.id}", comment: "Сверщик фабрики" }
    show:
      - { who: owner, url: "{story.page.url}", caption: "Стори в Confluence", seconds: 6 }
      - { who: pm, url: "{story.issue.url}", caption: "Фабрика завела стори и сверила её", seconds: 8, focus: "Сверщик фабрики" }
