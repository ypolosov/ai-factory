# Сценарий съёмки видео-демо: шаги сценария демо (scenario.md) - кто действует, как и что показать.
# Все роли играют ИИ-персонажи (состав 3, docs/compositions): реплики и правки персонажей заданы
# сценарием, работу фабрики (библиотекарь, сверщик, нарезка, агент, страж, судья) делает ИИ вживую.
# Решения своей области персонажи принимают по реестру ролей цели. Камера только снимает экраны.
# Запуск: scripts/demo-film.sh [--only шаг,шаг]; заготовки PR - film-assets/.
title: Повторный розыгрыш невостребованного приза

# Участники - ИИ-персонажи со своими учётками: бот Discord (.state/discord-<id>.env), Atlassian
# (.state/atlassian-<id>.env; jira - accountId для назначения) и приложение GitHub
# (.state/github-app-<id>.env и .pem). owner - человек, учётка фабрики; в сценарии не действует.
personas:
  owner: { name: Юрий - владелец продукта, kind: human, browser: atlassian }
  po: { name: PO, kind: ai, discord: po, atlassian: po, jira: "712020:d3f88f83-dcbc-47dd-a6ce-032bd266ee21", browser: atlassian }
  pm: { name: PM, kind: ai, discord: pm, atlassian: pm, jira: "712020:63480dfc-cc04-4e6b-8f57-f1c9929f0c89", browser: atlassian }
  architect: { name: Architect, kind: ai, discord: architect, atlassian: architect, github: architect, jira: "712020:60a01f69-2ed8-4e0b-a353-b5cdebb46f2e", browser: atlassian }
  designer: { name: Designer, kind: ai, discord: designer, atlassian: designer, jira: "712020:28c9e50f-44b7-4de5-8f75-5b4e5b245871", browser: atlassian }
  frontend: { name: Frontend, kind: ai, discord: frontend, atlassian: frontend, github: frontend, jira: "712020:47ae87fe-7e13-4728-8ea0-f21c42af68bb", browser: atlassian }
  backend: { name: Backend, kind: ai, discord: backend, atlassian: backend, github: backend, jira: "712020:41e37ff7-488f-49d0-84fc-78be0d419a58", browser: atlassian }
  qa: { name: QA, kind: ai, discord: qa, atlassian: qa, jira: "712020:4246dca1-3b5d-4ded-8888-7c30d2cadc6c", browser: atlassian }
  devops: { name: DevOps, kind: ai, discord: devops, atlassian: devops, github: devops, jira: "712020:3f787141-f967-45cc-bf8b-9eb71e7c01b4", browser: atlassian }
  # Самозванец - вебхук Discord без учётки, пишет от чужого имени (шаг 12a).
  impostor: { name: Самозванец - вебхук без учётки, kind: human }

# Сохранённые входы камеры в каталоге состояния (.state).
browsers:
  atlassian: camera/jira.json
  # Входы человека на сайтах для кадров (scripts/camera-login.sh ИМЯ АДРЕС).
  figma: camera/figma.json
  glitchtip: camera/glitchtip.json
  bitbucket: camera/bitbucket.json

steps:
  # 1. Библиотекарь (UC1, DoD 2).
  - id: librarian
    chapter: База знаний отвечает команде
    note: PO спрашивает фабрику в Discord - ответ со ссылками на правила и решения проекта
    who: po
    do:
      discord: { channel: продукт, text: "@factory что известно про невостребованные призы?" }
    wait:
      timeout: 180
      discord: { channel: продукт, contains: "Источники" }

  # 2. Стори из Confluence и сверка со знаниями проекта (UC1, DoD 5).
  - id: story
    chapter: Требование сверяется со знаниями проекта
    note: PO пишет стори в Confluence, фабрика заводит её в Jira и сверяет с правилами и решениями
    who: po
    do:
      wiki:
        title: Разыграть невостребованный приз заново среди всех участников
        body: Если победитель не подтвердил приз за 3 дня, приз разыгрывается заново среди всех участников розыгрыша. Так приз не пропадает, а участники получают ещё один шанс.
        label: story
    wait:
      timeout: 420
      jira: { label: "wiki-{story.page.id}", comment: "Сверщик фабрики" }
    show:
      - { who: po, url: "{story.page.url}", caption: "Стори PO в Confluence", seconds: 6 }
      - { who: po, url: "{story.issue.url}", caption: "Сверщик нашёл противоречие с ADR-3", seconds: 8, focus: "Сверщик фабрики" }

  - id: decision
    who: architect
    wait:
      timeout: 120
      jira: { deps: "{story.issue.key}", label: decision }

  # 3. Архитектор снимает противоречие: уточнение ADR-3 и правило-страж (UC1).
  - id: adr
    chapter: Архитектор решает противоречие
    note: Architect уточняет ADR-3 и добавляет правило-страж; слить PR - решение его роли
    who: architect
    do:
      comment:
        key: "{decision.issue.key}"
        text: "Предлагаю уточнить ADR-3: повтор невостребованного приза продолжает ту же последовательность из зерна - следующий кандидат среди ещё не выбранных. Новое зерно сломало бы проверку R4. Правило-страж no-random-outside-seed закроет другие источники случайности в api/src/."
      github:
        pr:
          branch: "film/{take}-adr-3"
          title: "ADR-3: повтор невостребованного приза продолжает последовательность ({decision.issue.key})"
          body: "Решение по задаче {decision.issue.key}: повтор невостребованного приза - следующий шаг той же последовательности из зерна (ADR-3), без нового зерна. Правило-страж no-random-outside-seed не пускает в api/src/ другие источники случайности."
          files:
            - path: docs/adr/ADR-3-reproducible-draw.md
              replace:
                - find: 'Повторный выбор с другим зерном или "заново среди всех" этому решению противоречит.'
                  with: "Повторный выбор с другим зерном этому решению противоречит; повтор невостребованного приза - в уточнении ниже."
              append: |

                ## Уточнение: повтор невостребованного приза ({decision.issue.key})

                Статус: принято.

                Проблема: победитель не подтвердил приз за 3 дня (R6), приз нужно разыграть снова, сохранив проверяемость выбора (R4) и правило одного приза (R5).

                Решение: повтор не берёт новое зерно. "Заново среди всех участников" значит: среди всех участников розыгрыша, кроме уже выбранных победителей, следующим шагом той же последовательности - индекс из HMAC-SHA256(зерно, "pick:i") по модулю числа оставшихся, где i - число уже сделанных выборов. Не подтвердивший приз победитель из кандидатов уже вышел.

                Последствия: повтор воспроизводим из опубликованного зерна так же, как исходный выбор; веб-приложение пересчитывает и его. Других источников случайности в `api/src/` нет: правило-страж `no-random-outside-seed` в `.factory/config.yml`.
            - path: .factory/config.yml
              append: |

                # Правила-стражи: добавленные строки изменения в paths не должны совпадать с forbid.
                rules:
                  - id: no-random-outside-seed
                    source: docs/adr/ADR-3-reproducible-draw.md
                    message: "случайность в api/src/ - только из зерна розыгрыша (ADR-3): Math.random и randomInt запрещены"
                    forbid: 'Math\.random|randomInt\('
                    paths: [api/src/]
    wait:
      timeout: 300
      github: { pr: "{adr.pr.number}", status: factory/verdict }
    show:
      - { who: architect, url: "{adr.pr.url}", caption: "PR архитектора и вердикт стража", seconds: 8, focus: "Вердикт стража" }

  - id: adr-merge
    who: architect
    do:
      github: { merge: { pr: "{adr.pr.number}", title: "ADR-3: повтор невостребованного приза продолжает последовательность" } }
      close: { key: "{decision.issue.key}" }
    wait:
      timeout: 600
      jira: { key: "{story.issue.key}", label: story-ok, comment: "Противоречие снято" }
    show:
      - { who: po, url: "{story.issue.url}", caption: "Сверщик: противоречие снято решением архитектора", seconds: 8, focus: "Противоречие снято" }

  # 4. Нарезка: предлагает PM, утверждает PO (UC2).
  - id: slice
    chapter: Стори нарезается на задачи
    note: PM просит нарезку, PO утверждает - задачи по одному шаблону со сценариями приёмки
    who: pm
    do:
      discord: { channel: продукт, text: "!нарезка {story.issue.key}" }
    wait:
      timeout: 300
      discord: { channel: продукт, contains: "Сверщик предлагает нарезку" }

  - id: approve
    who: po
    do:
      discord: { channel: продукт, text: "!утвердить {story.issue.key}" }
    wait:
      timeout: 180
      discord: { channel: продукт, contains: "Задачи заведены" }

  - id: api
    who: backend
    wait:
      timeout: 120
      jira: { deps: "{story.issue.key}", match: "API|запрос|эндпоинт|сервер" }
    show:
      - { who: pm, url: "{story.issue.url}", caption: "Нарезка утверждена PO", seconds: 6, focus: "Нарезка утверждена" }
      - { who: backend, url: "{api.issue.url}", caption: "Задача API: цель, сценарии приёмки, вне рамок, основания", seconds: 8 }

  # 4a. Спецификация OpenSpec перед работой агента (DoD изменения).
  - id: spec
    chapter: Спецификация перед работой агента
    note: Backend описывает изменение по OpenSpec; слияние PR утверждает требования и сценарии
    who: backend
    do:
      github:
        pr:
          branch: "film/{take}-{api.issue.key|lower}-spec"
          title: "{api.issue.key}: спецификация повтора невостребованного приза"
          body: "Изменение OpenSpec по задаче {api.issue.key}: замысел, требования со сценариями, решение, задачи, план проверки. После слияния задача уходит агенту фабрики."
          files:
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/.openspec.yaml", from: redraw/.openspec.yaml }
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/proposal.md", from: redraw/proposal.md }
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/specs/redraw-unclaimed-prize/spec.md", from: redraw/specs/redraw-unclaimed-prize/spec.md }
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/design.md", from: redraw/design.md }
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/tasks.md", from: redraw/tasks.md }
            - { path: "openspec/changes/{api.issue.key|lower}-redraw-unclaimed-prize/test-plan.md", from: redraw/test-plan.md }
    wait:
      timeout: 300
      github: { pr: "{spec.pr.number}", status: factory/verdict, success: true }
    show:
      - { who: backend, url: "{spec.pr.url}", caption: "Спецификация OpenSpec и зелёный вердикт стража", seconds: 8, focus: "Вердикт стража" }

  - id: spec-merge
    who: backend
    do:
      github: { merge: { pr: "{spec.pr.number}", title: "{api.issue.key}: спецификация повтора невостребованного приза" } }

  - id: handoff
    who: backend
    do:
      label: { key: "{api.issue.key}", label: "agent:backend" }
    wait:
      timeout: 300
      jira: { key: "{api.issue.key}", label: "agent-running|agent-review", comment: "Фабрика взяла задачу" }

  # 5. Агент фабрики и проверки PR (UC4, DoD 4); 5b - судья другого семейства моделей.
  - id: agent
    chapter: Агент фабрики делает задачу
    note: агент роли бэкенда работает на своём раннере; страж, сканеры и тест до кода проверяют PR
    who: backend
    wait:
      timeout: 2700
      jira: { key: "{api.issue.key}", label: "agent-review|agent-failed" }
      github: { head: "agent/{api.issue.key}-", status: factory/verdict }
    show:
      - { who: backend, url: "{handoff.comment.url}", login: bitbucket, caption: "Задание агента на раннере фабрики (Bitbucket Pipelines)", seconds: 3, scroll: 6 }
      - { who: backend, url: "{agent.pr.url}", caption: "PR агента: вердикт стража, сканеры, тест до кода", seconds: 3, scroll: 10 }
      - { who: pm, url: "{api.issue.url}", caption: "Задача: исполнитель Backend, списанное время агента", seconds: 6, scroll: 6 }

  - id: judge
    who: backend
    wait:
      timeout: 900
      github: { pr: "{agent.pr.number}", status: factory/judge }
    show:
      - { who: backend, url: "{agent.pr.url}", caption: "Судья фабрики - модель другого семейства", seconds: 4, focus: "Судья фабрики", scroll: 6 }

  # 5a. Сверка макета с задачей экрана (UC3).
  - id: fe
    who: designer
    wait:
      timeout: 60
      jira: { deps: "{story.issue.key}", match: "экран|кнопк|веб|интерфейс" }

  - id: design
    chapter: Макет сверяется с задачей
    note: Designer выгружает экран из Figma и просит фабрику сверить его с задачей и правилами - судит модель другого семейства
    who: designer
    do:
      discord: { channel: продукт, text: "!макет {fe.issue.key} https://www.figma.com/design/fAmgtG3ZDdllvl0XZFiKvU/?node-id=6-3", file: redraw-screen.png }
    wait:
      timeout: 900
      jira: { key: "{fe.issue.key}", label: "design-ok|design-changes", comment: "Сверка макета" }
    show:
      - { who: designer, url: "https://www.figma.com/design/fAmgtG3ZDdllvl0XZFiKvU/?node-id=6-3", login: figma, caption: "Макет экрана в Figma", seconds: 6 }
      - { who: designer, url: "{fe.issue.url}", caption: "Судья макета сверил экран из Figma с задачей", seconds: 4, focus: "Сверка макета", scroll: 6 }

  # 6. Экран: Frontend отдаёт задачу агенту роли фронтенда.
  - id: frontend
    chapter: Фронтенд отдаёт экран агенту
    note: Frontend ставит метку agent:frontend - агент роли меняет только web/ и e2e/
    who: frontend
    do:
      label: { key: "{fe.issue.key}", label: "agent:frontend" }
    wait:
      timeout: 2700
      github: { head: "agent/{fe.issue.key}-", status: factory/verdict }
    show:
      - { who: frontend, url: "{frontend.pr.url}", caption: "PR агента фронтенда и вердикт стража", seconds: 3, scroll: 8 }

  # 7. Правило-страж из решения архитектора не пускает случайность вне зерна (DoD 5).
  - id: guard
    chapter: Страж держит решение архитектора
    note: Backend пробует Math.random в api/src - правило no-random-outside-seed из ADR-3 краснит PR
    who: backend
    do:
      github:
        pr:
          branch: "film/{take}-random"
          title: "Проба: перемешать участников без зерна"
          body: "Проверка правила-стража no-random-outside-seed (ADR-3)."
          files:
            - path: api/src/domain/rules.ts
              append: |
                // Проба стража: перемешать участников без зерна розыгрыша.
                export const shuffleLoose = <T>(xs: T[]): T[] => [...xs].sort(() => Math.random() - 0.5);
    wait:
      timeout: 300
      github: { pr: "{guard.pr.number}", status: factory/verdict }
    show:
      - { who: backend, url: "{guard.pr.url}", caption: "Красный вердикт: правило no-random-outside-seed из ADR-3", seconds: 8, focus: "no-random-outside-seed" }

  - id: guard-close
    who: backend
    do:
      github: { closePr: { pr: "{guard.pr.number}" } }

  # 7a. QA перезапускает CI PR агента.
  - id: ci
    chapter: QA перезапускает проверки
    note: QA просит фабрику перезапустить CI PR агента - итог приходит в канал
    who: qa
    do:
      discord: { channel: разработка, text: "!ci {agent.pr.number}" }
    wait:
      timeout: 1200
      discord: { channel: разработка, contains: "CI PR {agent.pr.number}, ci:" }

  # 8. Слияние PR агента и выкладка: задача закрывается сама (UC4).
  - id: merge
    chapter: Слияние и выкладка
    note: Backend сливает PR агента, служба выкладки выкладывает main, задача закрывается сама
    who: backend
    do:
      github:
        merge: { pr: "{agent.pr.number}", title: "{api.issue.key}: API повторного розыгрыша невостребованного приза" }
        comment: { pr: "{agent.pr.number}", text: "Замечания судьи - отдельной задачей; поведение по спецификации готово, сливаю." }
    wait:
      timeout: 1800
      jira: { key: "{api.issue.key}", comment: "Сделано и выложено" }
    show:
      - { who: pm, url: "{api.issue.url}", caption: "Задача закрылась сама: сделано и выложено на стенд", seconds: 8, focus: "Сделано и выложено" }

  # 8a. Фронтенд: агент дорабатывает экран по замечанию в PR, Frontend сливает.
  - id: frontend-ask
    chapter: Агент дорабатывает по замечанию
    note: Frontend просит в PR модульные тесты и снова отдаёт задачу агенту - агент продолжает свою ветку
    who: frontend
    do:
      github: { comment: { pr: "{frontend.pr.number}", text: "Добавь модульные тесты на кнопку «Разыграть заново»: кнопка видна только у приза с истёкшим сроком подтверждения, нажатие вызывает повтор и показывает нового победителя." } }

  - id: frontend-rework
    who: frontend
    do:
      label: { key: "{fe.issue.key}", label: "agent:frontend" }
    wait:
      timeout: 2700
      github: { pr: "{frontend.pr.number}", status: factory/verdict, success: true }
    show:
      - { who: frontend, url: "{frontend.pr.url}", caption: "Агент дописал тесты - вердикт стража зелёный", seconds: 3, scroll: 8 }

  - id: frontend-merge
    who: frontend
    do:
      github: { merge: { pr: "{frontend.pr.number}", title: "{fe.issue.key}: кнопка «Разыграть заново» на экране организатора" } }
    wait:
      timeout: 1800
      jira: { key: "{fe.issue.key}", comment: "Сделано и выложено" }

  # 8b. Стенд: розыгрыш на выложенном коде; повтор раньше срока API отклоняет (R6), после срока -
  # повтор на экране организатора. Часы стенда демо сдвигают время на 4 дня (api/src/clock.ts цели).
  - id: stand
    chapter: Фича на стенде
    note: организатор проводит розыгрыш; раньше срока повтор отклонён (R6), через 4 дня приз разыгран заново
    who: po
    do:
      http:
        - { as: draw, method: POST, url: "http://127.0.0.1:8082/api/draws", body: { title: "Наушники для участников демо", prizes: 1 } }
        - { method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/entries", body: { participant: "Анна", birthDate: "1990-04-12" } }
        - { method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/entries", body: { participant: "Борис", birthDate: "1985-09-30" } }
        - { method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/entries", body: { participant: "Вера", birthDate: "1999-01-05" } }
        - { method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/close" }
        - { method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/draw" }
        - { as: redraw, method: POST, url: "http://127.0.0.1:8082/api/draws/{stand.draw.json.id}/winners/1/redraw" }
        - { as: clock, method: POST, url: "http://127.0.0.1:8082/api/demo/clock", body: { days: 4 } }
    show:
      - { who: po, url: "http://127.0.0.1:8082/#/draws/{stand.draw.json.id}", caption: "Стенд: победитель выбран из зерна, подтвердить приз - за 3 дня", seconds: 3, scroll: 4 }
      - { who: po, card: { title: "Повтор раньше срока - ответ {stand.redraw.status}", note: "{stand.redraw.json.message}" }, caption: "API повтора держит правило R6", seconds: 4 }
      - { who: po, url: "http://127.0.0.1:8082/#/draws/{stand.draw.json.id}", clockDays: 4, play: [{ click: "Разыграть заново" }, { wait: 3 }], caption: "Через 4 дня приз не подтверждён - организатор разыгрывает его заново", seconds: 4 }

  - id: stand-clock
    who: po
    do:
      http: { method: POST, url: "http://127.0.0.1:8082/api/demo/clock", body: { days: 0 } }

  - id: e2e
    who: qa
    do:
      discord: { channel: разработка, text: "!e2e" }
    wait:
      timeout: 1500
      discord: { channel: разработка, contains: "прошли" }

  # 9. Сбой на стенде становится багом с событием GlitchTip (UC6, DoD 7).
  - id: draw
    chapter: Сбой на стенде становится багом
    note: на стенде заявка с несуществующей датой рождения роняет API - фабрика заводит баг с событием сбоя
    who: devops
    do:
      http: { method: POST, url: "http://127.0.0.1:8082/api/draws", body: { title: "Розыгрыш для проверки сбоя", prizes: 1 } }

  - id: crash
    who: devops
    do:
      http: { method: POST, url: "http://127.0.0.1:8082/api/draws/{draw.json.id}/entries", body: { participant: "Гость стенда", birthDate: "2000-13-45" } }
    wait:
      timeout: 600
      jira: { label: incident, open: true }
    show:
      - { who: devops, card: { title: "POST /api/draws/{draw.json.id}/entries", note: "дата рождения 2000-13-45 - стенд ответил {crash.status}" }, caption: "Клиент API отправил заявку с несуществующей датой", seconds: 4 }
      - { who: devops, url: "http://127.0.0.1:8200/factory/issues", login: glitchtip, caption: "GlitchTip поймал сбой стенда", seconds: 6, focus: "date/time field value out of range" }
      - { who: devops, url: "{crash.issue.url}", caption: "Баг из сбоя: событие GlitchTip и место ошибки", seconds: 4, scroll: 6 }

  # 10. Агент чинит баг; после выкладки баг и сбой закрываются сами.
  - id: bugfix
    chapter: Агент чинит сбой
    note: PM отдаёт баг агенту бэкенда, Backend сливает исправление - баг и событие сбоя закрываются сами
    who: pm
    do:
      label: { key: "{crash.issue.key}", label: "agent:backend" }
    wait:
      timeout: 2700
      github: { head: "agent/{crash.issue.key}-", status: factory/verdict }
    show:
      - { who: backend, url: "{bugfix.pr.url}", caption: "Исправление сбоя от агента и вердикт стража", seconds: 8, focus: "Вердикт стража" }

  - id: bugfix-merge
    who: backend
    do:
      github: { merge: { pr: "{bugfix.pr.number}", title: "{crash.issue.key}: исправление сбоя на стенде" } }
    wait:
      timeout: 1800
      jira: { key: "{crash.issue.key}", comment: "Исправлено:" }
    show:
      - { who: devops, url: "{crash.issue.url}", caption: "Баг закрылся сам: исправление выложено, сбой решён", seconds: 8, focus: "Исправлено:" }

  # 11. Правило из повторяющихся замечаний людей (UC7, DoD 6).
  - id: remark-1
    chapter: Правило из повторяющихся замечаний
    note: Architect пишет одно и то же замечание в трёх PR и просит фабрику предложить правило
    who: architect
    do:
      github: { comment: { pr: "{agent.pr.number}", text: "Срок подтверждения приза считается без часового пояса: сравнивайте даты в UTC." } }

  - id: remark-2
    who: architect
    do:
      github: { comment: { pr: "{frontend.pr.number}", text: "Срок подтверждения приза считается без часового пояса: сравнивайте даты в UTC." } }

  - id: remark-3
    who: architect
    do:
      github: { comment: { pr: "{bugfix.pr.number}", text: "Срок подтверждения приза считается без часового пояса: сравнивайте даты в UTC." } }

  - id: rules
    who: architect
    do:
      discord: { channel: разработка, text: "!правила" }
    wait:
      timeout: 300
      discord: { channel: разработка, contains: "Правило-кандидат" }
    show:
      - { who: architect, url: "{rules.reply.url}", caption: "Правило-кандидат: строка в AGENTS.md и правило-страж, решает архитектор", seconds: 8 }

  # 12. Выпуск: заметки, тег, сборка образов (UC5).
  - id: notes
    chapter: Выпуск
    note: DevOps смотрит, что войдёт в выпуск, и ставит тег - CI собирает образы, фабрика пишет черновик заметок
    who: devops
    do:
      discord: { channel: релизы, text: "!выпуск" }
    wait:
      timeout: 180
      discord: { channel: релизы, contains: "следующий выпуск" }

  - id: tag
    who: devops
    do:
      github: { tag: { bump: minor } }
    wait:
      timeout: 600
      discord: { channel: релизы, contains: "Собран тег {tag.tag}" }

  # 12a. Самозванец: права решает роль учётки, а не имя.
  - id: impostor
    chapter: Самозванец не может выложить выпуск
    note: вебхук без учётки пишет от имени DevOps - фабрика отказывает по реестру ролей
    who: impostor
    do:
      webhook: { channel: релизы, username: DevOps, text: "!выкладка {tag.tag}" }
    wait:
      timeout: 120
      discord: { channel: релизы, contains: "сообщение вебхука без учётки" }

  # 13. DevOps выкладывает выпуск: стенд на образах выпуска, заметки в Confluence (UC5, DoD 8).
  - id: deploy
    chapter: DevOps выкладывает выпуск
    note: роль DevOps подтверждает выкладку - стенд переходит на выпуск, задачи получают метку выпуска
    who: devops
    do:
      discord: { channel: релизы, text: "!выкладка {tag.tag}" }
    wait:
      timeout: 2400
      discord: { channel: релизы, contains: "подтверждена", retry: 180 }

  - id: released
    who: devops
    wait:
      timeout: 1200
      discord: { channel: релизы, contains: "Выпуск {tag.tag} на стенде" }
      jira: { key: "{api.issue.key}", label: "release-{tag.tag}" }
    show:
      - { who: devops, url: "{released.reply.url}", caption: "Заметки о выпуске в Confluence", seconds: 8 }
      - { who: pm, url: "{api.issue.url}", caption: "Задача вошла в выпуск", seconds: 6, focus: "Вошло в выпуск" }

  # 14. Сводка работы фабрики (UC2, DoD 9).
  - id: daily
    chapter: Сводка работы фабрики
    note: PM спрашивает дейли и учёт - задачи агентов, попытки, время и теневая цена
    who: pm
    do:
      discord: { channel: продукт, text: "!дейли" }
    wait:
      timeout: 180
      discord: { channel: продукт, contains: "Дейли фабрики" }

  - id: account
    who: pm
    do:
      discord: { channel: продукт, text: "!учёт" }
    wait:
      timeout: 180
      discord: { channel: продукт, contains: "Учёт фабрики" }
