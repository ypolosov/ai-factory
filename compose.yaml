# Ядро стенда фабрики (сборка С1): git-хостинг Forgejo и три runner.
# У каждого runner свой Docker-in-Docker: задания агента, проверок и выкладки
# не видят друг друга и Docker хоста. Порты публикуются только на 127.0.0.1.
# Запуск - через scripts/stand-up.sh: он готовит .state/ до старта runner.
name: ai-factory

x-dind: &dind
  image: docker.io/library/docker:29.9.0-dind
  restart: unless-stopped
  # dind требует privileged; сами задания запускаются без privileged
  # (container.privileged: false в настройках runner).
  privileged: true
  environment:
    DOCKER_TLS_CERTDIR: ""
  networks: [factory]

# Адрес Forgejo один для людей и для заданий - ROOT_URL (http://127.0.0.1:3000):
# по нему Forgejo строит ссылки на артефакты и клоны. Задания живут в сетевом
# пространстве своего dind, поэтому там 127.0.0.1:3000 пробрасывается к Forgejo.
# Адрес - IPv4, а не localhost: localhost внутри может означать ::1.
x-loopback: &loopback
  image: docker.io/alpine/socat:1.8.1.1
  restart: unless-stopped
  command: ["tcp-listen:${FORGEJO_HTTP_PORT:-3000},bind=127.0.0.1,fork,reuseaddr", "tcp-connect:forgejo:3000"]

# Выход наружу для Docker заданий: только через прокси egress (список разрешённых адресов).
x-jobs-proxy: &jobs-proxy
  HTTP_PROXY: http://egress:3128
  HTTPS_PROXY: http://egress:3128
  NO_PROXY: localhost,127.0.0.1,forgejo,gateway,egress

x-runner: &runner
  image: code.forgejo.org/forgejo/runner:13.2.0
  restart: unless-stopped
  command: ["forgejo-runner", "daemon", "--config", "/config/runner.yaml"]
  environment:
    # Docker API только через unix-сокет в общем томе: по сети он не слушает,
    # и контейнеры заданий до него не дотягиваются.
    DOCKER_HOST: unix:///var/run/dind/docker.sock
  networks: [factory]

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.9
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:${FORGEJO_HTTP_PORT:-3000}/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
    volumes:
      - forgejo-data:/data
    ports:
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [factory, jobs]

  # Docker заданий агента и проверок - во внутренней сети jobs: Forgejo и шлюз видны
  # напрямую, интернет - только через прокси egress по списку.
  agent-dind:
    <<: *dind
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=1000"]
    environment:
      DOCKER_TLS_CERTDIR: ""
      <<: *jobs-proxy
    networks: [jobs]
    volumes:
      - agent-dind-sock:/var/run/dind
      - agent-dind-lib:/var/lib/docker

  agent-loopback:
    <<: *loopback
    network_mode: service:agent-dind
    depends_on: [agent-dind]

  runner-agent:
    <<: *runner
    depends_on: [forgejo, agent-dind]
    volumes:
      - ./.state/runner-agent:/config:ro
      - runner-agent-data:/data
      - agent-dind-sock:/var/run/dind

  ci-dind:
    <<: *dind
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=1000"]
    environment:
      DOCKER_TLS_CERTDIR: ""
      <<: *jobs-proxy
    networks: [jobs]
    volumes:
      - ci-dind-sock:/var/run/dind
      - ci-dind-lib:/var/lib/docker

  ci-loopback:
    <<: *loopback
    network_mode: service:ci-dind
    depends_on: [ci-dind]

  runner-ci:
    <<: *runner
    depends_on: [forgejo, ci-dind]
    volumes:
      - ./.state/runner-ci:/config:ro
      - runner-ci-data:/data
      - ci-dind-sock:/var/run/dind

  # Docker стенда: здесь работают выложенные приложения (порты 8080-8089) и задания выкладки.
  deploy-dind:
    <<: *dind
    command: ["dockerd", "--host=unix:///var/run/dind/docker.sock", "--group=1000"]
    ports:
      - "127.0.0.1:8080-8089:8080-8089"
    volumes:
      - deploy-dind-sock:/var/run/dind
      - deploy-dind-lib:/var/lib/docker

  deploy-loopback:
    <<: *loopback
    network_mode: service:deploy-dind
    depends_on: [deploy-dind]

  # Приложения стенда шлют ошибки в GlitchTip. Имена сети фабрики в их контейнерах не
  # разрешаются, поэтому имя glitchtip там указывает на Docker стенда (host-gateway), а здесь
  # порт 8000 пробрасывается к GlitchTip.
  deploy-glitchtip:
    image: docker.io/alpine/socat:1.8.1.1
    restart: unless-stopped
    command: ["tcp-listen:8000,fork,reuseaddr", "tcp-connect:glitchtip:8000"]
    network_mode: service:deploy-dind
    depends_on: [deploy-dind]

  runner-deploy:
    <<: *runner
    depends_on: [forgejo, deploy-dind]
    volumes:
      - ./.state/runner-deploy:/config:ro
      - runner-deploy-data:/data
      - deploy-dind-sock:/var/run/dind

  # Служба выкладки: сама забирает слитые в main коммиты и выкладывает их на стенд.
  # Docker стенда видит только она (и runner выкладки); задания Actions - нет.
  deployer:
    build: images/deployer
    image: factory/deployer:stand
    restart: unless-stopped
    depends_on: [forgejo, deploy-dind]
    environment:
      DOCKER_HOST: unix:///var/run/dind/docker.sock
      FORGEJO_URL: http://forgejo:3000
      DEPLOY_APPS: ${DEPLOY_APPS:-factory-admin/hello=8080 factory-admin/todo=8081}
      STAND_HOST: deploy-dind
      STAND_PUBLIC_HOST: 127.0.0.1
    volumes:
      - deploy-dind-sock:/var/run/dind
      - ./.state/deployer:/secrets:ro
      - deployer-state:/state
      - deployer-cache:/cache
    networks: [factory]

  # Проверки доступности: упавшая проверка приложения сама заводит задачу в Forgejo.
  gatus:
    image: docker.io/twinproduction/gatus:v5.37.0
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./.state/gatus:/config:ro
    ports:
      - "127.0.0.1:${GATUS_PORT:-8100}:8080"
    depends_on: [forgejo, deploy-dind]
    networks: [factory]

  # Сбор ошибок приложений стенда: GlitchTip (совместим с Sentry) - веб и обработчик в одном
  # процессе, кэш и очередь в Postgres, без Valkey. Приложения шлют ошибки по DSN, который
  # служба выкладки передаёт им при запуске. Новая ошибка -> вебхук в errbridge -> задача.
  glitchtip-db:
    image: docker.io/library/postgres:17.11-alpine3.24
    restart: unless-stopped
    env_file:
      - path: .state/glitchtip/env
        required: false
    volumes:
      - glitchtip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [glitchtip]

  glitchtip:
    image: docker.io/glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    depends_on:
      glitchtip-db:
        condition: service_healthy
    env_file:
      - path: .state/glitchtip/env
        required: false
    environment:
      SERVER_ROLE: all_in_one
      VALKEY_URL: ""
      GLITCHTIP_DOMAIN: http://127.0.0.1:${GLITCHTIP_PORT:-8200}
      DEFAULT_FROM_EMAIL: glitchtip@factory.local
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      # Вебхук оповещений идёт во внутреннюю сеть фабрики (errbridge).
      GLITCHTIP_ALLOW_PRIVATE_IPS: "true"
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8200}:8000"
    networks: [factory, glitchtip]

  # Мост "ошибка на стенде -> задача": оповещение GlitchTip -> задача в репозитории
  # приложения от учётки эксплуатации, со стеком последнего события.
  errbridge:
    build: images/errbridge
    image: factory/errbridge:stand
    restart: unless-stopped
    read_only: true
    depends_on: [forgejo]
    environment:
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_OPS_USER: ${FORGEJO_OPS_USER:-factory-ops}
      GLITCHTIP_URL: http://glitchtip:8000
      DEPLOY_APPS: ${DEPLOY_APPS:-factory-admin/hello=8080 factory-admin/todo=8081}
    volumes:
      - ./.state/errbridge:/secrets:ro
    networks: [factory]

  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    restart: unless-stopped
    # Свой uid: файлы ключей в .state/ читает только их владелец.
    user: "1000:1000"
    command: ["-f", "/state/gateway.yaml"]
    volumes:
      # Каталоги, а не одиночные файлы: Docker Desktop теряет смонтированный
      # файл, если его заменить новым (sed -i, mv).
      - ./.state/gateway:/state:ro
      - ./.state/gateway-db:/db
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    networks: [factory, jobs]

  # Прокси выхода заданий: Squid со списком разрешённых адресов (images/egress/allowlist.txt).
  egress:
    build: images/egress
    image: factory/egress:stand
    restart: unless-stopped
    networks: [factory, jobs]

volumes:
  forgejo-data:
  agent-dind-sock:
  agent-dind-lib:
  runner-agent-data:
  ci-dind-sock:
  ci-dind-lib:
  runner-ci-data:
  deploy-dind-sock:
  deploy-dind-lib:
  runner-deploy-data:
  deployer-state:
  deployer-cache:
  glitchtip-db:

networks:
  factory: {}
  # База GlitchTip видна только самому GlitchTip.
  glitchtip:
    internal: true
  # Внутренняя сеть без выхода в интернет: Docker заданий агента и проверок.
  jobs:
    internal: true
