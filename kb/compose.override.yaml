# База знаний стенда: Onyx (MIT-часть, без ee) из kb/onyx - файлы развёртывания Onyx
# v4.8.1 без изменений, - и эти правки поверх. Запуск - scripts/kb-up.sh.
#
# - модель ответов и эмбеддинги - через шлюз фабрики (ключ kb, пути kb-*; переключение -
#   scripts/kb-model.sh), поэтому api и фоновые задачи видят сеть фабрики;
# - вход в Onyx (nginx) - только 127.0.0.1:${KB_PORT:-8300}; в сетях фабрики и заданий он
#   же под именем kb: оттуда идут загрузка из Forgejo и MCP для агентов;
# - песочница кода Onyx (code-interpreter) выключена: ей нужен сокет Docker хоста;
# - файлы - в Postgres, без MinIO; MCP-сервер Onyx включён;
# - OpenSearch без закрепления памяти: Docker без root (rootless) не даёт снять предел
#   memlock (runc: "error setting rlimit type 8"); цена - куча JVM может уйти в подкачку.
services:
  api_server:
    networks: [default, factory]
  background:
    networks: [default, factory]
  opensearch:
    environment:
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: 65536
        hard: 65536
  nginx:
    ports: !override
      - "127.0.0.1:${KB_PORT:-8300}:80"
    environment:
      - DOMAIN=localhost
      - MCP_SERVER_ENABLED=true
    depends_on:
      mcp_server:
        condition: service_started
    networks:
      default: {}
      factory:
        aliases: [kb]
      jobs:
        aliases: [kb]
  mcp_server:
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    command: ["python", "-m", "onyx.mcp_server_main"]
    env_file:
      - path: .env
        required: false
    depends_on: [relational_db, cache]
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=relational_db
      - REDIS_HOST=cache
      - MCP_SERVER_ENABLED=true
      - MCP_SERVER_PORT=8090
      - API_SERVER_PROTOCOL=http
      - API_SERVER_HOST=api_server
  code-interpreter:
    profiles: ["disabled"]

networks:
  factory:
    external: true
    name: ai-factory_factory
  jobs:
    external: true
    name: ai-factory_jobs
